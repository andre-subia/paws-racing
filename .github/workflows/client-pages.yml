name: client-pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/client/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/client-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build client
        env:
          GITHUB_PAGES: '1'
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL || 'wss://paws-racing-staging.fly.dev' }}
        run: pnpm --filter @paws/client build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
